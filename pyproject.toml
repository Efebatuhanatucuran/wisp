[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "Static security scanner for Model Context Protocol (MCP) server configurations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Efe Batuhan Atucuran" }]
keywords = ["mcp", "model-context-protocol", "security", "ai-security", "llm-security", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/efebatuhanatucuran/mcp-sentinel"

[project.scripts]
mcp-sentinel = "mcpsentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsentinel"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx2"]
web = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
